name: test + release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

      - name: generate release report
        id: report
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PREV=$(git tag --sort=-version:refname | grep '^v' | sed -n '2p' || echo "")
          CHANGES=$(git log ${PREV:+${PREV}..HEAD} --oneline --no-decorate 2>/dev/null || git log --oneline -10)

          echo "## 🧘 pi-monk v$VERSION" > report.md
          echo "" >> report.md

          # test results
          echo "### ✅ Tests" >> report.md
          echo '```' >> report.md
          npm test 2>&1 | tail -10 >> report.md
          echo '```' >> report.md
          echo "" >> report.md

          # changelog
          echo "### 📋 Changes" >> report.md
          echo '```' >> report.md
          echo "$CHANGES" >> report.md
          echo '```' >> report.md
          echo "" >> report.md

          # compression stats from commit messages
          echo "### 📊 Stats" >> report.md
          COMP=$(echo "$CHANGES" | grep -ci "compres\|savings\|monk" || echo 0)
          echo "- Commits since last release: $(echo "$CHANGES" | wc -l)" >> report.md
          echo "- Related to compression: $COMP" >> report.md

          cat report.md

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          name: 🧘 pi-monk ${{ github.ref_name }}
          body_path: report.md
          files: |
            README.md
